apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: apps
  labels:
    app: sample-app
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      containers:
        - name: sample-app
          image: gitopsbook/sample-app:v0.1
          command: ["/app/sample-app"]
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
        - name: nginx-sidecar
          image: nginx:1.27-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              cat <<'EOF' > /etc/nginx/conf.d/default.conf
              server {
                listen 8081;
                access_log /var/log/nginx/access.log;
                error_log /var/log/nginx/error.log warn;

                location / {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_pass http://127.0.0.1:8080;
                }
              }
              EOF
              nginx -g 'daemon off;'
          ports:
            - containerPort: 8081
          readinessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 2
            periodSeconds: 5
